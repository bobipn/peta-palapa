<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Introducing Portal Komersial</title>
<style>
@font-face{font-family:'Inter';font-weight:100 900;src:url('inter.woff2') format('woff2');}

canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="routes.js"></script>
<script src="land.js"></script>
<script>
'use strict';
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const INK='#141414',OR='#FF8A3D',OR2='#E2621A',SOFT='#FFD9BF',GREY='#8C8C8C',LINE='#D9D9D9',MONO='DejaVu Sans Mono';
let T=0,BOIL=0;
const PI=Math.PI;
/* ---------- math ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(){let h=2166136261;for(let i=0;i<arguments.length;i++){h^=(Math.round(arguments[i]*7)|0);h=Math.imul(h,16777619);}return h>>>0}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
 back:t=>{const c=1.9,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
 expo:t=>t>=1?1:1-Math.pow(2,-10*t),
 el:t=>t===0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*PI)/3)+1};
/* ---------- geometry ---------- */
function densify(pts,step){const o=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/step));for(let k=1;k<=n;k++)o.push([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)]);}return o}
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function cutPts(p,a,b){if(a<=0&&b>=1)return p;const L=plen(p),A=a*L,B=b*L;const o=[];let acc=0;for(let i=1;i<p.length;i++){const s=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);const s0=acc,s1=acc+s;if(s1>=A&&s0<=B){const u0=s?clamp((A-s0)/s):0,u1=s?clamp((B-s0)/s):1;if(!o.length)o.push([lerp(p[i-1][0],p[i][0],u0),lerp(p[i-1][1],p[i][1],u0)]);o.push([lerp(p[i-1][0],p[i][0],u1),lerp(p[i-1][1],p[i][1],u1)]);}acc=s1;if(acc>B)break;}return o}
function ptAt(p,f){const c=cutPts(p,0,clamp(f,0.0001,1));const q=c[c.length-1],r=c.length>1?c[c.length-2]:q;return [q[0],q[1],Math.atan2(q[1]-r[1],q[0]-r[0])]}
function ell(cx,cy,rx,ry,st=-PI/2){const n=Math.max(14,Math.round((rx+ry)*PI/12));const o=[];for(let i=0;i<n;i++){const a=st+i/n*2*PI;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o}
function rrect(x,y,w,h,r=14){r=Math.min(r,w/2,h/2);const o=[];const c=[[x+w-r,y+r,-PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,PI/2],[x+r,y+r,PI]];o.push([x+r,y]);for(const [cx,cy,a0] of c){for(let k=0;k<=4;k++){const a=a0+k/4*PI/2;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}}return o}
/* ---------- sketch drawing ---------- */
function smooth(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);if(p.length<3){for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);return}for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my)}const l=p[p.length-1];ctx.lineTo(l[0],l[1])}
function jit(base,amp,seed){const r=mulberry(seed);const ox=(r()-.5)*amp,oy=(r()-.5)*amp;return base.map(q=>[q[0]+ox+(r()-.5)*amp,q[1]+oy+(r()-.5)*amp])}
function sk(pts,o={}){
 const {closed=false,p=1,p0=0,w=3,c=INK,amp=2.2,passes=2,seed=0,step=18,dash=null,a=1,boil=true}=o;
 if(p<=p0||a<=0)return;
 let base=densify(closed?[...pts,pts[0]]:pts,step);
 if(closed&&base.length>3)base=base.concat(base.slice(1,3));
 const bo=boil?BOIL:0;
 for(let k=0;k<passes;k++){
  const jp=jit(base,amp,hash(seed,k,bo,pts[0][0],pts[0][1],pts.length));
  const seg=cutPts(jp,p0,p);if(seg.length<2)continue;
  ctx.save();ctx.globalAlpha*=k?a*.45:a;ctx.strokeStyle=c;ctx.lineWidth=k?Math.max(1,w*.5):w;ctx.lineCap='round';ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);smooth(seg);ctx.stroke();ctx.restore();
 }
}
function fillP(pts,c,o={}){const {amp=1.6,seed=0,off=[0,0],a=1}=o;if(a<=0)return;const jp=jit(densify([...pts,pts[0]],24),amp,hash(seed,BOIL,pts[0][0],7));ctx.save();ctx.globalAlpha*=a;ctx.translate(off[0],off[1]);ctx.fillStyle=c;smooth(jp);ctx.closePath();ctx.fill();ctx.restore()}
function hatch(pts,c,o={}){const {gap=14,ang=-0.9,w=2,a=1,p=1}=o;if(p<=0)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of pts){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])}
 ctx.save();ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const q of pts)ctx.lineTo(q[0],q[1]);ctx.closePath();ctx.clip();
 const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+10;const r=mulberry(hash(BOIL,x0,y0));ctx.strokeStyle=c;ctx.lineWidth=w;ctx.globalAlpha*=a;ctx.lineCap='round';
 const n=Math.ceil(2*R/gap);for(let i=0;i<n*p;i++){const d=-R+i*gap;const ca=Math.cos(ang),sa=Math.sin(ang);const px=cx-sa*d,py=cy+ca*d;ctx.beginPath();ctx.moveTo(px-ca*R+(r()-.5)*4,py-sa*R+(r()-.5)*4);ctx.lineTo(px+ca*R+(r()-.5)*4,py+sa*R+(r()-.5)*4);ctx.stroke()}
 ctx.restore()}
function box(x,y,w,h,o={}){const {r=16,fill='#fff',p=1,w:lw=3,c=INK,shadow=true,a=1}=o;const pts=rrect(x,y,w,h,r);if(p>=.25){const fa=clamp((p-.25)/.4)*a;if(shadow)fillP(rrect(x+8,y+9,w,h,r),'rgba(20,20,20,.10)',{a:fa});if(fill)fillP(pts,fill,{a:fa,amp:1})}sk(pts,{closed:true,p,w:lw,c,a});}
/* ---------- text ---------- */
function font(size,weight=600,fam='Inter'){return `${weight} ${size}px ${fam==='Inter'?"'Inter'":fam==='Caveat'?"'Caveat'":"'"+fam+"'"}`}
function mw(s,size,weight=600,fam='Inter'){ctx.save();ctx.font=font(size,weight,fam);const w=ctx.measureText(s).width;ctx.restore();return w}
function txt(s,x,y,o={}){const {size=40,weight=600,fam='Inter',c=INK,align='left',p=1,a=1,rot=0,ls=0}=o;if(p<=0||a<=0)return 0;ctx.save();ctx.font=font(size,weight,fam);if(ls)ctx.letterSpacing=ls+'px';const w=ctx.measureText(s).width;const x0=align==='center'?x-w/2:align==='right'?x-w:x;
 if(p<1){ctx.beginPath();ctx.rect(x0-20,y-size*1.4,(w+40)*p,size*2);ctx.clip()}
 ctx.globalAlpha*=a;ctx.fillStyle=c;if(rot){ctx.translate(x0,y);ctx.rotate(rot);ctx.fillText(s,0,0)}else ctx.fillText(s,x0,y);ctx.restore();return w}
function hand(s,x,y,o={}){const r=mulberry(hash(BOIL,x,y));return txt(s,x,y,Object.assign({fam:'Caveat',weight:500,rot:(r()-.5)*0.012},o))}
/* slam letters in one by one */
function slam(parts,x,y,size,t0,dt,o={}){const {weight=800,align='left',ls=-2}=o;let total=0;for(const [s] of parts)total+=mw(s,size,weight)+ls*s.length;let cx=align==='center'?x-total/2:x;let i=0;const pos=[];
 for(const [s,c] of parts){for(const ch of s){const w=mw(ch,size,weight)+ls;const k=prog(T,t0+i*dt,t0+i*dt+.22);if(k>0){const sc=lerp(1.9,1,E.back(k));ctx.save();ctx.translate(cx+w/2,y-size*.35);ctx.scale(sc,sc);ctx.rotate((1-E.out(k))*((i%2)?.3:-.3));ctx.globalAlpha*=clamp(k*3);ctx.font=font(size,weight);ctx.fillStyle=c;ctx.textAlign='center';ctx.fillText(ch,0,size*.35);ctx.restore()}pos.push([cx,w,c]);cx+=w;i++}}
 return {x0:align==='center'?x-total/2:x,w:total}}
/* ---------- camera ---------- */
function cam(z=1,fx=W/2,fy=H/2,r=0,sx=0,sy=0){ctx.setTransform(1,0,0,1,0,0);ctx.translate(W/2+sx,H/2+sy);ctx.rotate(r);ctx.scale(z,z);ctx.translate(-fx,-fy);dots(z,fx,fy)}
function dots(z,fx,fy){const g=60;const hw=W/2/z+g,hh=H/2/z+g;ctx.save();ctx.fillStyle='rgba(20,20,20,.075)';const xs=Math.floor((fx-hw)/g)*g,ys=Math.floor((fy-hh)/g)*g;for(let x=xs;x<fx+hw;x+=g)for(let y=ys;y<fy+hh;y+=g){ctx.fillRect(x-1.5,y-1.5,3,3)}ctx.restore()}
function shake(t0,dur,amp){const k=prog(T,t0,t0+dur);if(k<=0||k>=1)return [0,0];const r=mulberry(hash(Math.floor(T*30)));const m=amp*(1-k);return [(r()-.5)*2*m,(r()-.5)*2*m]}
/* ---------- mascot ---------- */
function limb(pts,w,amp=1.4){sk(pts,{w:w+8,c:INK,amp,passes:1,step:10});sk(pts,{w,c:OR,amp:amp*.5,passes:1,step:10})}
function prop(type,a){ctx.save();ctx.rotate(a);
 if(type==='pencil'){fillP([[-14,-8],[52,-8],[52,8],[-14,8]],INK);fillP([[52,-8],[76,0],[52,8]],'#F4E3CC');sk([[52,-8],[76,0],[52,8]],{closed:true,w:2.5});fillP([[68,-3],[77,0],[68,3]],INK)}
 else if(type==='dart'){sk([[-6,0],[64,0]],{w:5,passes:1});fillP([[64,-6],[80,0],[64,6]],INK);fillP([[-6,0],[-22,-14],[6,0]],OR);fillP([[-6,0],[-22,14],[6,0]],OR);sk([[-6,0],[-22,-14],[6,0],[-22,14],[-6,0]],{w:2})}
 else if(type==='mag'){sk([[-4,0],[34,0]],{w:10,passes:1});const c=ell(60,0,26,26);fillP(c,'rgba(255,255,255,.75)');sk(c,{closed:true,w:6});sk([[48,-10],[58,-16]],{w:3,c:GREY})}
 else if(type==='plug'){fillP([[-4,-14],[34,-14],[34,14],[-4,14]],INK);sk([[34,-7],[52,-7]],{w:5,passes:1});sk([[34,7],[52,7]],{w:5,passes:1})}
 else if(type==='marker'){fillP([[-10,-10],[56,-10],[56,10],[-10,10]],OR);sk([[-10,-10],[56,-10],[56,10],[-10,10]],{closed:true,w:3});fillP([[56,-6],[72,-3],[72,3],[56,6]],INK)}
 ctx.restore()}
function cat(x,y,s,o={}){
 ctx.save();ctx.translate(x,y);const sq=o.sq||1;ctx.scale(s*(o.flip?-1:1)/Math.sqrt(sq),s*sq);if(o.rot)ctx.rotate(o.rot);
 const A=1.5,wk=o.walk;const lf=wk!=null?Math.sin(wk)*15:0,l1=wk!=null?Math.max(0,Math.sin(wk))*12:0,l2=wk!=null?Math.max(0,-Math.sin(wk))*12:0,bob=wk!=null?-Math.abs(Math.sin(wk))*6:0;
 const ts=o.tailSpeed||3.2;const tail=[];for(let i=0;i<=12;i++){const u=i/12;tail.push([36+u*58+Math.sin(u*3+T*ts)*10*u,-24-u*104+Math.cos(u*2+T*ts)*8*u])}
 limb(tail,17,A);sk(tail.slice(9),{w:17,c:OR2,passes:1,step:8});
 const foot=(fx,fy)=>{const f=ell(fx,fy,18,10);fillP(f,OR);sk(f,{closed:true,w:4,amp:A})};
 foot(-22+lf,-9-l1);foot(22-lf,-9-l2);
 ctx.translate(0,bob);
 const body=ell(0,-62,46,58);fillP(body,OR,{off:[2,2]});sk(body,{closed:true,w:5,amp:A});
 fillP(ell(0,-52,27,36),'#fff');
 for(const sgn of [-1,1]){sk([[sgn*45,-78],[sgn*31,-73]],{w:5,c:OR2,passes:1});sk([[sgn*46,-58],[sgn*33,-55]],{w:5,c:OR2,passes:1})}
 const arm=(sx,sy,a,pr)=>{const L=o.armLen||52;const ex=sx+Math.cos(a)*L,ey=sy+Math.sin(a)*L;limb([[sx,sy],[(sx+ex)/2,(sy+ey)/2],[ex,ey]],16,A);if(pr){ctx.save();ctx.translate(ex,ey);prop(pr,a);ctx.restore()}const pw=ell(ex,ey,11,11);fillP(pw,OR);sk(pw,{closed:true,w:4,amp:A})};
 arm(-30,-92,o.armL!=null?o.armL:PI/2+.38,o.propL);
 // head
 ctx.save();ctx.translate(0,-160);if(o.tilt)ctx.rotate(o.tilt);
 for(const sgn of [-1,1]){const e=[[sgn*54,-14],[sgn*48,-72],[sgn*12,-40]];fillP(e,OR);sk(e,{closed:true,w:5,amp:A});fillP([[sgn*45,-24],[sgn*43,-56],[sgn*22,-38]],SOFT)}
 const hd=ell(0,0,62,49);fillP(hd,OR,{off:[2,2]});sk(hd,{closed:true,w:5,amp:A});
 sk([[-12,-47],[-10,-31]],{w:5,c:OR2,passes:1});sk([[0,-49],[0,-32]],{w:5,c:OR2,passes:1});sk([[12,-47],[10,-31]],{w:5,c:OR2,passes:1});
 const lk=o.look||[0,0];const bp=((T*0.41+(o.seed||0))%1+1)%1;const bl=o.blink!=null?o.blink:(bp<0.07?Math.sin(bp/0.07*PI):0);
 for(const sgn of [-1,1]){const ex=sgn*23+lk[0],ey=-2+lk[1];if(o.happy){sk([[ex-8,ey+3],[ex,ey-6],[ex+8,ey+3]],{w:5,passes:1})}else{ctx.save();ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(ex,ey,8,Math.max(1.2,12*(1-bl)),0,0,2*PI);ctx.fill();if(bl<.5){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-2.5,ey-4,2.8,0,2*PI);ctx.fill()}ctx.restore()}}
 ctx.save();ctx.fillStyle='rgba(226,98,26,.45)';for(const sgn of [-1,1]){ctx.beginPath();ctx.arc(sgn*38,16,8,0,2*PI);ctx.fill()}ctx.restore();
 fillP([[-6,11],[6,11],[0,18]],INK,{amp:.6});
 if(o.mouth==='open'){const m=ell(0,28,9,10);fillP(m,INK);fillP(ell(0,33,5,4),'#FF9E9E')}else{sk([[-11,23],[-5,28],[0,22]],{w:3,passes:1,amp:.8});sk([[0,22],[5,28],[11,23]],{w:3,passes:1,amp:.8})}
 for(const sgn of [-1,1]){sk([[sgn*34,12],[sgn*82,2]],{w:2.4,passes:1,amp:1});sk([[sgn*34,18],[sgn*84,18]],{w:2.4,passes:1,amp:1});sk([[sgn*34,24],[sgn*80,33]],{w:2.4,passes:1,amp:1})}
 ctx.restore();
 // collar + tag with L
 sk([[-32,-112],[0,-104],[32,-112]],{w:8,passes:1});
 fillP(rrect(-11,-106,22,22,5),INK);txt('L',0,-89,{size:16,weight:800,c:'#fff',align:'center'});
 arm(30,-92,o.armR!=null?o.armR:PI/2-.38,o.propR);
 ctx.restore()}
/* ---------- brand bits ---------- */
function monogram(x,y,s,p=1){if(p<=0)return;const k=E.back(clamp(p*1.3));ctx.save();ctx.translate(x+s/2,y+s/2);ctx.scale(k,k);ctx.translate(-s/2,-s/2);fillP(rrect(0,0,s,s,s*.22),INK);txt('L',s/2,s*.73,{size:s*.62,weight:800,c:'#fff',align:'center'});ctx.restore()}
function scribbleUnder(x,y,w,p,c=OR,wd=10){const pts=[];for(let i=0;i<=8;i++)pts.push([x+w*i/8,y+Math.sin(i*1.7)*5]);pts.push([x+w*.08,y+14]);pts.push([x+w*.95,y+10]);sk(pts,{p,w:wd,c,passes:1,amp:3})}
function scribbleCircle(cx,cy,rx,ry,p,c=OR,w=7){const pts=[];for(let i=0;i<=34;i++){const a=-2.4+i/30*2*PI;const rr=1+i*.004;pts.push([cx+Math.cos(a)*rx*rr,cy+Math.sin(a)*ry*rr])}sk(pts,{p,w,c,passes:2,amp:3})}
function checkMark(x,y,s,p,c=OR,w=8){sk([[x-s*.5,y],[x-s*.12,y+s*.4],[x+s*.6,y-s*.5]],{p,w,c,passes:1,amp:2})}
/* ---------- icons (40px, centered) ---------- */
const ICON={
 help:(x,y)=>{sk(ell(x,y,18,18).slice(8),{w:4,c:OR});fillP(rrect(x-22,y-2,10,18,3),OR);fillP(rrect(x+12,y-2,10,18,3),OR)},
 crm:(x,y)=>{sk([[x-22,y-16],[x+22,y-16],[x+6,y+2],[x+6,y+18],[x-6,y+12],[x-6,y+2]],{closed:true,w:4,c:OR})},
 cloud:(x,y)=>{sk([[x-20,y+12],[x-24,y],[x-12,y-8],[x-4,y-18],[x+10,y-14],[x+16,y-4],[x+24,y+4],[x+18,y+12]],{closed:true,w:4,c:OR})},
 cart:(x,y)=>{sk([[x-24,y-16],[x-16,y-16],[x-10,y+8],[x+16,y+8],[x+22,y-8],[x-13,y-8]],{w:4,c:OR});fillP(ell(x-6,y+16,4,4),OR);fillP(ell(x+12,y+16,4,4),OR)},
 gauge:(x,y)=>{sk(ell(x,y+8,22,22,PI).slice(0,12),{w:4,c:OR});sk([[x,y+8],[x+12,y-8]],{w:4,c:INK})},
 bars:(x,y)=>{for(let i=0;i<4;i++)fillP(rrect(x-20+i*11,y+14-(8+i*8),7,8+i*8,2),i%2?INK:OR)},
 list:(x,y)=>{for(let i=0;i<3;i++){fillP(ell(x-18,y-12+i*12,3,3),OR);sk([[x-10,y-12+i*12],[x+20,y-12+i*12]],{w:4,c:INK,passes:1})}},
 pin:(x,y)=>{sk([[x,y+20],[x-14,y-2],[x-12,y-14],[x,y-20],[x+12,y-14],[x+14,y-2]],{closed:true,w:4,c:OR});fillP(ell(x,y-6,4,4),INK)},
 globe:(x,y)=>{sk(ell(x,y,19,19),{closed:true,w:4,c:OR});sk(ell(x,y,8,19),{closed:true,w:2.5,c:INK,passes:1});sk([[x-19,y],[x+19,y]],{w:2.5,c:INK,passes:1})},
 mic:(x,y)=>{fillP(rrect(x-7,y-20,14,24,7),OR);sk([[x-14,y-2],[x-12,y+8],[x,y+12],[x+12,y+8],[x+14,y-2]],{w:3});sk([[x,y+12],[x,y+20]],{w:3})},
 video:(x,y)=>{fillP(rrect(x-22,y-12,30,24,5),OR);sk([[x+10,y-4],[x+22,y-12],[x+22,y+12],[x+10,y+4]],{closed:true,w:3})},
 spark:(x,y)=>{const s=[[x,y-20],[x+5,y-5],[x+20,y],[x+5,y+5],[x,y+20],[x-5,y+5],[x-20,y],[x-5,y-5]];fillP(s,OR);sk(s,{closed:true,w:2.5})},
 folder:(x,y)=>{sk([[x-22,y+14],[x-22,y-14],[x-8,y-14],[x-4,y-8],[x+22,y-8],[x+22,y+14]],{closed:true,w:4,c:OR})},
 clock:(x,y)=>{sk(ell(x,y,19,19),{closed:true,w:4,c:OR});sk([[x,y-10],[x,y],[x+9,y+5]],{w:3.5})},
 cal:(x,y)=>{sk(rrect(x-20,y-16,40,34,5),{closed:true,w:4,c:OR});sk([[x-20,y-6],[x+20,y-6]],{w:3});fillP(ell(x+8,y+7,4,4),INK)}
};
/* ---------- data: real module names from komersiallti.my.id ---------- */
