<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTI Sales Cloud · Palapa Ring Paket Tengah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1B5FA6;--blue2:#2E86DE;--sky:#EAF3FB;--bg:#EEF3F8;--card:#fff;--line:#DDE6EF;
  --ink:#1C2C3E;--mute:#697D93;--green:#12A05C;--red:#E4534A;--amber:#E8A33D;--violet:#7A5FD0;--teal:#0FA3A3;}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}
a{color:inherit}
.top{background:linear-gradient(90deg,#0E3F72,#1B5FA6);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;height:54px;position:sticky;top:0;z-index:50}
.top .logo{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}
.top .logo .bx{width:28px;height:28px;border-radius:8px;background:#fff;color:#1B5FA6;display:grid;place-items:center;font-weight:800}
.top .logo small{display:block;font-size:9px;font-weight:600;letter-spacing:.12em;color:#bcd6ef;text-transform:uppercase}
.top .sp{flex:1}
.env a{color:#cfe2f5;text-decoration:none;font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.22);margin-left:5px;white-space:nowrap}
.env a:hover{background:rgba(255,255,255,.12)}
.tabs{display:flex;gap:2px;padding:0 14px;background:#0E3F72;overflow-x:auto;position:sticky;top:54px;z-index:49}
.tabs button{color:#bcd6ef;padding:11px 15px;font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:#2E86DE;background:rgba(255,255,255,.06)}
.tabs button:hover{color:#fff}
.wrap{padding:16px;max-width:1360px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
h2.vh{font-size:18px;font-weight:800;margin:0}
.sub{color:var(--mute);font-size:12.5px;margin:2px 0 0}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:220px}
.srch input{border:none;outline:none;width:100%;background:none}
.sel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.btn{background:var(--blue);color:#fff;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.warn{background:#fff;color:var(--red);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:20px;font-weight:800;margin-top:3px}
.kpi .s{font-size:11px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 12px;font-size:14px}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F5F9FD;text-align:left;padding:10px 12px;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--ink)}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:#F5F9FD}
.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:10px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;display:inline-block}
.badge{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px}
.hbar{display:grid;grid-template-columns:130px 1fr 92px;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.hbar .tk{height:11px;background:#EEF3F8;border-radius:6px;overflow:hidden}
.hbar .tk i{display:block;height:100%;border-radius:6px}
.hbar .vv{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(14,40,66,.4);z-index:90;display:none}.ov.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,96vw);background:#fff;z-index:100;box-shadow:-12px 0 40px rgba(14,40,66,.25);transform:translateX(105%);transition:.22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dr-h .x{margin-left:auto;font-size:22px;color:var(--mute)}
.dr-b{padding:16px 18px;overflow-y:auto;flex:1}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10.5px;color:var(--mute);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;background:#fff}
.fld input:focus,.fld select:focus{border-color:var(--blue2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.foot{padding:16px;color:var(--mute);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1C2C3E;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.view{display:none}.view.on{display:block}
.progress{height:7px;background:#EEF3F8;border-radius:5px;overflow:hidden;margin-top:5px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2E86DE,#12A05C)}
@media(max-width:640px){.two{grid-template-columns:1fr}.env{display:none}}
</style>
</head>

/* ---------- helpers ---------- */
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800);}
function svgBars(rows,color,fmt){ const mx=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(r=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis">${esc(r[0])}</span>
    <span class="tk"><i style="width:${Math.max(r[1]/mx*100,1)}%;background:${typeof color==='function'?color(r[0]):color}"></i></span>
    <span class="vv">${fmt?fmt(r[1]):r[1]}</span></div>`).join(''); }
function donut(parts){ // parts: [[label,value,color]]
  const tot=parts.reduce((a,p)=>a+p[1],0)||1; let acc=0; const R=52,C=2*Math.PI*R;
  const segs=parts.map(p=>{const frac=p[1]/tot;const dash=`${frac*C} ${C}`;const off=-acc*C;acc+=frac;
    return `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p[2]}" stroke-width="20" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>`;}).join('');
  const leg=parts.map(p=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0"><span style="width:10px;height:10px;border-radius:2px;background:${p[2]}"></span>${esc(p[0])} <b style="margin-left:auto">${p[1]}</b></div>`).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">${segs}</svg><div style="flex:1;min-width:120px">${leg}</div></div>`;
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const O=DB.opps, open=O.filter(o=>!o.stage.startsWith('Closed'));
  const won=O.filter(o=>o.stage==='Closed Won'), lost=O.filter(o=>o.stage==='Closed Lost');
  const pipeline=open.reduce((a,o)=>a+o.amount,0);
  const forecast=open.reduce((a,o)=>a+o.amount*o.prob/100,0)+won.reduce((a,o)=>a+o.amount,0);
  const wonVal=won.reduce((a,o)=>a+o.amount,0);
  const winRate=(won.length+lost.length)?Math.round(won.length/(won.length+lost.length)*100):0;
  const attain=DB.target?Math.min(100,Math.round(forecast/DB.target*100)):0;
  const kpi=(l,v,s)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`;
  // charts
  const byStage=STAGES.map(s=>[s,O.filter(o=>o.stage===s).length]);
  const byAM=AMS.map(a=>[a,won.filter(o=>o.owner===a).reduce((x,o)=>x+o.amount,0)]);
  const bySeg=['P4','P5','P6','P7','P8A','P8B'].map(s=>[s,O.filter(o=>segP(o.seg)===s).reduce((x,o)=>x+o.amount*(o.stage==='Closed Won'?1:o.prob/100),0)]);
  const prodMix=[['Bandwidth',O.filter(o=>/Bandwidth/.test(o.product)&&!/PPU/.test(o.product)).length,'#1B5FA6'],
    ['Bandwidth PPU',O.filter(o=>/PPU/.test(o.product)).length,'#2E86DE'],
    ['Dark Fiber',O.filter(o=>/Darkfiber/.test(o.product)).length,'#0FA3A3'],
    ['Kolokasi',O.filter(o=>/Kolokasi/.test(o.product)).length,'#7A5FD0'],
    ['Lainnya',O.filter(o=>/Bantek/.test(o.product)).length,'#E8A33D']].filter(p=>p[1]>0);
  const actOpen=DB.acts.filter(a=>a.status==='Open').length, actDone=DB.acts.filter(a=>a.status==='Done').length;
  document.getElementById('v-dashboard').innerHTML=`
    <div class="bar"><div><h2 class="vh">Sales Dashboard</h2><p class="sub">Ringkasan pipeline, forecast, dan aktivitas — ${O.length} opportunity · ${DB.accounts.length} account</p></div></div>
    <div class="kpis">
      ${kpi('Total Pipeline',jt(pipeline),open.length+' opportunity terbuka')}
      ${kpi('Weighted Forecast',jt(forecast),'termasuk Closed Won')}
      ${kpi('Closed Won',jt(wonVal),won.length+' deal')}
      ${kpi('Win Rate',winRate+'%',won.length+' menang · '+lost.length+' kalah')}
      ${kpi('Attainment',attain+'%','target '+jt(DB.target))}
      ${kpi('Aktivitas',actOpen+' open',actDone+' selesai')}
    </div>
    <div class="grid">
      <div class="card"><h3>1 · Pipeline per Tahap (funnel)</h3>${svgBars(byStage,s=>stageColor(s))}</div>
      <div class="card"><h3>2 · Forecast vs Target</h3>
        <div style="font-size:26px;font-weight:800;color:#12A05C">${jt(forecast)}</div>
        <div class="progress"><i style="width:${attain}%"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:5px"><span>${attain}% dari target</span><span>${jt(DB.target)}</span></div>
        <div style="margin-top:12px">${svgBars([['Weighted',forecast],['Best case',pipeline+wonVal],['Committed',wonVal]],'#2E86DE',jt)}</div>
      </div>
      <div class="card"><h3>3 · Closed Won per AM</h3>${svgBars(byAM,'#12A05C',jt)}</div>
      <div class="card"><h3>4 · Forecast Tertimbang per Ruas</h3>${svgBars(bySeg,'#7A5FD0',jt)}</div>
      <div class="card"><h3>5 · Product Mix (opportunity)</h3>${donut(prodMix)}</div>
      <div class="card"><h3>Aktivitas Sales</h3>${donut([['Open',actOpen,'#E8A33D'],['Selesai',actDone,'#12A05C']])}</div>
    </div>`;
}

      ['status','Status','sel',['Draft','Sent','Accepted','Rejected']],['validUntil','Berlaku s/d','date'],['owner','Owner','sel',AMS]]},

    cols:[['name','Produk'],['category','Kategori','pill'],['unit','Satuan'],['price','Harga','rp']],
    fields:[['name','Nama Produk'],['category','Kategori','sel',['Bandwidth','Dark Fiber','Kolokasi','Microwave']],['unit','Satuan'],['price','Harga (Rp)','num']]},
  contracts:{coll:'contracts',title:'Contracts',sub:'Kontrak aktif & masa berlaku',
    cols:[['cid','Contract ID'],['account','Account'],['product','Produk'],['value','Nilai','rp'],['start','Mulai'],['end','Berakhir'],['status','Status','pill']],
    fields:[['cid','Contract ID'],['account','Account'],['product','Produk'],['value','Nilai (Rp)','num'],
      ['start','Tanggal Mulai','date'],['end','Tanggal Berakhir','date'],['status','Status','sel',['Draft','Active','Expired']],['owner','Owner','sel',AMS]]},
  activities:{coll:'acts',title:'Activities',sub:'Task & Event — aktivitas sales terhadap customer',
    cols:[['subject','Subjek'],['type','Jenis','pill'],['related','Terkait'],['due','Jatuh Tempo'],['status','Status','pill'],['owner','Owner']],
    fields:[['subject','Subjek'],['type','Jenis','sel',['Call','Email','Meeting','Task']],['related','Terkait (Account)'],
      ['due','Jatuh Tempo','date'],['status','Status','sel',['Open','Done']],['owner','Owner','sel',AMS]]},
};
let sortState={}, curModel=null, curUid=null, filt={};
function cellRender(v,type,key){
  if(type==='rp')return `<span class="n">${rp(v)}</span>`;
  if(type==='pct')return `<span class="n">${v||0}%</span>`;
  if(type==='score'){const c=v>=75?'#12A05C':v>=50?'#E8A33D':'#E4534A';return `<b style="color:${c}">${v||0}</b>`;}
  if(type==='pill'){
    let bg='#EEF3F8',col='#697D93';
    if(STAGES.includes(v)){col='#fff';bg=stageColor(v);}
    else if(TYPES[v]){col='#fff';bg=TYPES[v];}
    else if(['Good','Active','Accepted','Done','Qualified'].includes(v)){bg='#E3F5EC';col='#12A05C';}
    else if(['Watch','Sent','Working','Draft'].includes(v)){bg='#FFF4E2';col='#B97B15';}
    else if(['Hold','Rejected','Expired','Unqualified','Open'].includes(v)){bg='#FDEAE9';col='#E4534A';}
    else if(['Call','Email','Meeting','Task','New','Bandwidth','Dark Fiber','Kolokasi','Microwave'].includes(v)){bg='#EAF3FB';col='#1B5FA6';}
    return `<span class="pill" style="background:${bg};color:${col}">${esc(v)}</span>`;
  }
  return esc(v);
}
function renderModule(name){
  const m=MODELS[name]; const el=document.getElementById('v-'+name);
  const q=(filt[name]||'').toLowerCase();
  let list=DB[m.coll].filter(r=>!q||m.cols.some(c=>String(r[c[0]]||'').toLowerCase().includes(q)));
  const s=sortState[name];
  if(s){list=list.slice().sort((a,b)=>{const va=a[s.k],vb=b[s.k];
    return (typeof va==='number'&&typeof vb==='number')?(va-vb)*s.d:String(va||'').localeCompare(String(vb||''),'id')*s.d;});}
  const head=m.cols.map(c=>`<th data-k="${c[0]}" class="${c[2]==='rp'||c[2]==='pct'||c[2]==='score'?'n':''}">${c[1]}${s&&s.k===c[0]?(s.d>0?' ▲':' ▼'):''}</th>`).join('');
  const body=list.map(r=>`<tr data-u="${r.u}">${m.cols.map(c=>`<td class="${c[2]==='rp'||c[2]==='pct'?'n':''}">${cellRender(r[c[0]],c[2],c[0])}</td>`).join('')}</tr>`).join('')
    || `<tr><td colspan="${m.cols.length}" style="text-align:center;color:var(--mute);padding:26px">Tidak ada data.</td></tr>`;
  el.innerHTML=`
    <div class="bar"><div><h2 class="vh">${m.title}</h2><p class="sub">${m.sub}</p></div>
      <div style="flex:1"></div>
      <div class="srch">🔎<input placeholder="Cari…" value="${esc(filt[name]||'')}" oninput="setFilt('${name}',this.value)"></div>
      <button class="btn" onclick="openRec('${name}',null)">＋ Baru</button>
      <button class="btn ghost" onclick="exportModel('${name}')">⬇ CSV</button>
    </div>
    <div class="tbl-wrap"><div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  el.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k; const cur=sortState[name];
    sortState[name]=cur&&cur.k===k?{k,d:-cur.d}:{k,d:-1}; renderModule(name);
  }));
  el.querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click',()=>tr.dataset.u&&openRec(name,tr.dataset.u)));
}
window.setFilt=(name,v)=>{filt[name]=v;renderModule(name);};
window.exportModel=(name)=>{const m=MODELS[name];const cols=m.cols.map(c=>c[0]);
  const cell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv='﻿'+m.cols.map(c=>c[1]).join(',')+'\n'+DB[m.coll].map(r=>cols.map(c=>cell(r[c])).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='LTI_Sales_'+name+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),200);};

/* ---------- DRAWER (generic CRUD) ---------- */
const ov=document.getElementById('ov'),dr=document.getElementById('drawer');
function openRec(name,u){
  const m=MODELS[name]; curModel=name; curUid=u;
  const rec=u?DB[m.coll].find(x=>x.u===u):{};
  document.getElementById('drT').textContent=u?(rec[m.fields[0][0]]||m.title):'Baru · '+m.title;
  document.getElementById('drS').textContent=m.title;
  document.getElementById('drB').innerHTML=m.fields.map(f=>{
    const [k,label,type,opts]=f; const val=rec[k]!=null?rec[k]:'';
    if(type==='sel')return `<div class="fld"><label>${label}</label><select data-k="${k}">${opts.map(o=>`<option${String(o)===String(val)?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    const it=type==='num'?'number':type==='date'?'date':'text';
    return `<div class="fld"><label>${label}</label><input data-k="${k}" type="${it}" value="${esc(val)}"></div>`;
  }).join('') + (m.extra&&u?m.extra(rec):'');
  document.getElementById('drDel').style.display=u?'':'none';
  ov.classList.add('open');dr.classList.add('open');
}
function closeRec(){ov.classList.remove('open');dr.classList.remove('open');}
ov.addEventListener('click',closeRec);document.getElementById('drX').addEventListener('click',closeRec);
document.getElementById('drSave').addEventListener('click',()=>{
  const m=MODELS[curModel]; const rec=curUid?DB[m.coll].find(x=>x.u===curUid):{u:uid(curModel[0])};
  document.querySelectorAll('#drB [data-k]').forEach(inp=>{
    let v=inp.value; if(inp.type==='number')v=+v||0; rec[inp.dataset.k]=v;});
  if(curModel==='opps')rec.prob=PROB[rec.stage]!=null?PROB[rec.stage]:(rec.prob||0);
  if(!curUid)DB[m.coll].unshift(rec);
  save(); closeRec(); rerender(); toast('Tersimpan');
});
document.getElementById('drDel').addEventListener('click',()=>{
  if(!confirm('Hapus record ini?'))return; const m=MODELS[curModel];
  DB[m.coll]=DB[m.coll].filter(x=>x.u!==curUid); save(); closeRec(); rerender(); toast('Dihapus');
});
window.openRec=openRec;
window.convertLead=(u)=>{
  const l=DB.leads.find(x=>x.u===u); if(!l)return;
  DB.accounts.unshift({u:uid('a'),name:l.company,type:'ISP Regional',contact:l.name,email:l.email,phone:l.phone,city:'-',creditLimit:2e9,ar:0,cond:'Good',owner:l.owner});
  DB.opps.unshift({u:uid('o'),name:l.company+' — New Opportunity',account:l.company,product:'FO_Bandwidth',seg:'',amount:0,stage:'Opportunity',prob:10,close:daysFromNow(30),owner:l.owner,kap:0});
  DB.leads=DB.leads.filter(x=>x.u!==u);
  save(); closeRec(); rerender(); toast('Lead dikonversi ke Account + Opportunity');
};

/* ---------- NAV ---------- */
let view='dashboard';
function rerender(){
  if(view==='dashboard')renderDashboard(); else if(MODELS[view])renderModule(view);
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  view=b.dataset.v;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view));
  rerender(); window.scrollTo({top:0,behavior:'smooth'});
});
renderDashboard();
</script>
