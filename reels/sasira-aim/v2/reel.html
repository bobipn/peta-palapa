<!doctype html>
<html><head><meta charset="utf-8"><title>Sasira Reel v2</title>
<style>
@font-face{font-family:Fr;src:url(Fraunces-Italic.ttf);font-style:italic;font-weight:100 900}
@font-face{font-family:Cav;src:url(Caveat.ttf);font-style:normal;font-weight:400 700}
@font-face{font-family:Mo;src:url(Montserrat.ttf);font-style:normal;font-weight:100 900}
@font-face{font-family:MoI;src:url(Montserrat-Italic.ttf);font-style:italic;font-weight:100 900}
html,body{margin:0;background:#111}
canvas{display:block;width:360px;height:640px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Reel @sasira_aim v2: artisan, Indonesian narration. 1080x1920, 30fps, 15s, 96 BPM (24 beats).
const W=1080,H=1920,FPS=30,DUR=15,BEAT=0.625,STEP=12;
const main=document.getElementById('c');const mainCtx=main.getContext('2d');let x=mainCtx;
const off=document.createElement('canvas');off.width=W;off.height=H;const offCtx=off.getContext('2d');

// ---------- math ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const eOut=t=>1-Math.pow(1-t,3),eIn=t=>t*t*t,eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let T=0;const stepOf=t=>Math.floor(t*STEP+1e-6);const sT=t=>stepOf(t)/STEP; // stop-motion time (12fps)

const C={ink:'#2A2420',cabai:'#B5301C',kunyit:'#D99A1E',pandan:'#4F7A36',terakota:'#A5572F',cream:'#FBF6EA',screen:'#FBF8F2'};
const NAMES=['00-ayam-songkem','01-brownies-kukus','02-nasi-kuning','03-telur-ceplok','04-pindang-tongkol','05-spring-roll','06-capcay','07-ayam-suwir','08-udang-pete','09-ikan-nila','10-soft-cookies','11-creamy-meatballs'];
const IMG=NAMES.map(n=>{const i=new Image();i.src='img/'+n+'.jpg';return i});

// ---------- textures ----------
function makeTex(base,o={}){
  const {seed=1,fibers=9000,dark='70,48,25',light='255,255,255',blot='150,110,60',veins=0,specks=1600,blots=40}=o;
  const w=W+60,h=H+60;const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');const r=rng(seed);
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<blots;i++){const px=r()*w,py=r()*h,rad=80+r()*380;const col=r()>.5?blot:light;const gr=g.createRadialGradient(px,py,0,px,py,rad);gr.addColorStop(0,`rgba(${col},${.03+r()*.05})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(px-rad,py-rad,rad*2,rad*2);}
  for(let v=0;v<veins;v++){g.beginPath();let px=r()*w,py=r()*h;g.moveTo(px,py);const a=r()*Math.PI;
    for(let k=0;k<9;k++){const nx=px+Math.cos(a+(r()-.5)*1.2)*170,ny=py+Math.sin(a+(r()-.5)*1.2)*170;g.quadraticCurveTo(px+(r()-.5)*120,py+(r()-.5)*120,nx,ny);px=nx;py=ny;}
    g.strokeStyle=r()>.3?`rgba(255,255,255,${.16+r()*.22})`:`rgba(60,58,55,${.07+r()*.09})`;g.lineWidth=.8+r()*3;g.stroke();}
  g.lineCap='round';
  for(let i=0;i<fibers;i++){const px=r()*w,py=r()*h,l=3+r()*16,a=r()*Math.PI;g.strokeStyle=`rgba(${r()>.45?dark:light},${.035+r()*.08})`;g.lineWidth=.6+r()*1.1;g.beginPath();g.moveTo(px,py);g.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);g.stroke();}
  for(let i=0;i<specks;i++){g.fillStyle=`rgba(${dark},${.06+r()*.16})`;g.beginPath();g.arc(r()*w,r()*h,.4+r()*1.4,0,7);g.fill();}
  return cv;
}
function makeGrain(seed){const cv=document.createElement('canvas');cv.width=540;cv.height=960;const g=cv.getContext('2d');const id=g.createImageData(540,960);const r=rng(seed);
  for(let i=0;i<id.data.length;i+=4){const v=128+(r()-.5)*110;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);return cv;}
function makeStamp(label,color){
  const cv=document.createElement('canvas');const g=cv.getContext('2d');g.font='800 56px Mo';g.letterSpacing='7px';const tw=g.measureText(label).width;
  cv.width=Math.ceil(tw+110);cv.height=140;
  g.strokeStyle=color;g.fillStyle=color;g.lineWidth=7;g.beginPath();g.roundRect(6,6,cv.width-12,128,16);g.stroke();
  g.lineWidth=2.5;g.beginPath();g.roundRect(17,17,cv.width-34,106,10);g.stroke();
  g.font='800 56px Mo';g.letterSpacing='7px';g.textAlign='center';g.textBaseline='middle';g.fillText(label,cv.width/2+3,73);
  g.globalCompositeOperation='destination-out';const r=rng(label.length*97+label.charCodeAt(5));
  for(let i=0;i<2600;i++){g.globalAlpha=.35+r()*.65;g.beginPath();g.arc(r()*cv.width,r()*cv.height,.5+r()*2.2,0,7);g.fill();}
  for(let i=0;i<7;i++){g.globalAlpha=.16+r()*.2;g.beginPath();g.ellipse(r()*cv.width,r()*cv.height,20+r()*50,8+r()*20,r()*3,0,7);g.fill();}
  return cv;
}
let PAPER,KRAFT,STONE,GRAIN=[],STAMPS={};
function bg(tex,tint=null){x.drawImage(tex,-30,-30);if(tint){x.fillStyle=tint;x.fillRect(-30,-30,W+60,H+60);}}
function cam(cx,cy,s,rot=0,dx=0,dy=0){x.translate(cx+dx,cy+dy);x.rotate(rot);x.scale(s,s);x.translate(-cx,-cy);}

// ---------- hand-drawn ink ----------
function sPath(pts,closed,seed,amp=1.8){
  const r=rng((seed|0)*7919+stepOf(T)*104729+1);
  const p=pts.map(([a,b])=>[a+(r()-.5)*2*amp,b+(r()-.5)*2*amp]);
  x.beginPath();if(p.length<2)return;
  if(closed){const n=p.length;const m=i=>[(p[i%n][0]+p[(i+1)%n][0])/2,(p[i%n][1]+p[(i+1)%n][1])/2];
    const s=m(n-1);x.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const q=m(i);x.quadraticCurveTo(p[i][0],p[i][1],q[0],q[1]);}x.closePath();}
  else{x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){x.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);}const l=p[p.length-1];x.lineTo(l[0],l[1]);}
}
function ellP(cx,cy,rx,ry,{n=40,rough=.025,seed=1,rot=0,a0=0,a1=Math.PI*2}={}){
  const r=rng(seed);const p1=r()*6.28,p2=r()*6.28,p3=r()*6.28;const pts=[];const cr=Math.cos(rot),sr=Math.sin(rot);
  for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/n;const k=1+rough*(Math.sin(3*a+p1)*.5+Math.sin(5*a+p2)*.3+Math.sin(9*a+p3)*.2);
    const px=Math.cos(a)*rx*k,py=Math.sin(a)*ry*k;pts.push([cx+px*cr-py*sr,cy+px*sr+py*cr]);}
  return pts;
}
function rrP(x0,y0,w,h,r,n=6){
  const pts=[];const seg=(ax,ay,bx,by,k)=>{for(let i=0;i<k;i++)pts.push([lerp(ax,bx,i/k),lerp(ay,by,i/k)])};
  const corner=(cx,cy,a0)=>{for(let i=0;i<n;i++){const a=a0+i/n*Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}};
  seg(x0+r,y0,x0+w-r,y0,10);corner(x0+w-r,y0+r,-Math.PI/2);seg(x0+w,y0+r,x0+w,y0+h-r,16);corner(x0+w-r,y0+h-r,0);
  seg(x0+w-r,y0+h,x0+r,y0+h,10);corner(x0+r,y0+h-r,Math.PI/2);seg(x0,y0+h-r,x0,y0+r,16);corner(x0+r,y0+r,Math.PI);
  return pts;
}
function partial(pts,f,closed=false){
  const P=closed?[...pts,pts[0]]:pts;let L=0;const d=[0];
  for(let i=1;i<P.length;i++){L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);d.push(L)}
  const target=L*clamp(f);const out=[P[0]];
  for(let i=1;i<P.length;i++){if(d[i]<=target)out.push(P[i]);else{const k=(target-d[i-1])/((d[i]-d[i-1])||1);out.push([lerp(P[i-1][0],P[i][0],k),lerp(P[i-1][1],P[i][1],k)]);break;}}
  return out;
}
function inkShape(pts,{fill=null,stroke=C.ink,lw=6,seed=1,closed=true,amp=1.8,alpha=1}={}){
  if(pts.length<2)return;x.save();x.globalAlpha*=alpha;sPath(pts,closed,seed,amp);
  if(fill){x.fillStyle=fill;x.fill();}
  if(stroke&&lw>0){x.lineWidth=lw;x.strokeStyle=stroke;x.lineJoin='round';x.lineCap='round';x.stroke();}
  x.restore();
}
function heartPts(cx,cy,s){const p=[];for(let i=0;i<40;i++){const a=i/40*Math.PI*2;p.push([cx+16*Math.pow(Math.sin(a),3)*s,cy-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*s]);}return p;}

// ---------- type ----------
function setF(px,{font='Fr',w=500,style='italic',ls=0}={}){x.font=`${style} ${w} ${px}px ${font}`;x.letterSpacing=ls+'px';}
function words(str,cx,y,t,t0,o={}){
  const {px=90,font='Fr',w=500,style='italic',align='center',color=C.ink,stagger=.07,dur=.24,hi={},exitT=null,rise=30}=o;
  x.save();setF(px,{font,w,style});x.textBaseline='alphabetic';x.textAlign='left';
  const ws=str.split(' ');const sp=x.measureText(' ').width;const wd=ws.map(s=>x.measureText(s).width);
  const tot=wd.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  let xx=align==='center'?cx-tot/2:align==='right'?cx-tot:cx;const boxes=[];
  ws.forEach((s,i)=>{const tw=t-(t0+i*stagger);boxes.push({s,x:xx,w:wd[i],y});
    if(tw>0){const k=eOut(clamp(tw/dur));let a=k,dy=(1-k)*rise,dx=0,rot=0;
      if(exitT!==null&&t>exitT){const r=rng(i*31+str.length*7);const e=eIn(clamp((t-exitT-i*.025)/.2));dy-=e*(300+r()*260);dx=(r()-.5)*240*e;rot=(r()-.5)*.7*e;a*=1-e;}
      if(a>0){x.save();x.globalAlpha*=a;x.translate(xx+wd[i]/2+dx,y+dy);x.rotate(rot);x.fillStyle=hi[s]||color;x.fillText(s,-wd[i]/2,0);x.restore();}}
    xx+=wd[i]+sp;});
  x.restore();return boxes;
}
function swash(x0,y0,len,f,{seed=1,color=C.cabai,lw=10,lift=10}={}){
  if(f<=0)return;const r=rng(seed);const n=40;const ph=r()*6;const pts=[];
  for(let i=0;i<=n;i++){const s=i/n;pts.push([x0+s*len,y0+Math.sin(s*Math.PI*1.3+ph)*4-s*lift+(r()-.5)*1.5]);}
  const m=Math.max(2,Math.floor(n*clamp(f)));const Lp=[],Rp=[];
  for(let i=0;i<=m;i++){const s=i/n;const p=pts[i],q=pts[Math.min(i+1,n)],p0=pts[Math.max(i-1,0)];const dx=q[0]-p0[0],dy=q[1]-p0[1];const l=Math.hypot(dx,dy)||1;
    const wv=lw*(0.3+0.7*Math.sin(Math.PI*Math.min(1,s*1.02)))/2;Lp.push([p[0]-dy/l*wv,p[1]+dx/l*wv]);Rp.push([p[0]+dy/l*wv,p[1]-dx/l*wv]);}
  x.save();x.fillStyle=color;x.beginPath();x.moveTo(Lp[0][0],Lp[0][1]);Lp.forEach(p=>x.lineTo(p[0],p[1]));Rp.reverse().forEach(p=>x.lineTo(p[0],p[1]));x.closePath();x.fill();x.restore();
}
function note(lines,cx,cy,rot,t,t0,{px=58,color=C.ink,dur=.42,lh=1.08}={}){
  if(t<t0)return;x.save();x.translate(cx,cy);x.rotate(rot);setF(px,{font:'Cav',w:600,style:'normal'});x.textAlign='left';x.textBaseline='alphabetic';
  lines.forEach((ln,i)=>{const w=x.measureText(ln).width;const f=clamp((t-t0-i*dur*.85)/dur);if(f<=0)return;const yy=i*px*lh;
    x.save();x.beginPath();x.rect(-10,yy-px,w*f+12,px*1.45);x.clip();x.fillStyle=color;x.fillText(ln,0,yy);x.restore();});
  x.restore();
}
function arrow(p0,p1,p2,f,{color=C.ink,lw=5,seed=3}={}){
  if(f<=0)return;const pts=[];for(let i=0;i<=30;i++){const s=i/30,a=(1-s)*(1-s),b=2*s*(1-s),d=s*s;pts.push([a*p0[0]+b*p1[0]+d*p2[0],a*p0[1]+b*p1[1]+d*p2[1]]);}
  const pp=partial(pts,f);inkShape(pp,{closed:false,stroke:color,lw,seed,amp:1.2});
  if(f>.9){const e=pp[pp.length-1],q=pp[Math.max(0,pp.length-4)];const ang=Math.atan2(e[1]-q[1],e[0]-q[0]),k=28;
    inkShape([[e[0]-Math.cos(ang-.5)*k,e[1]-Math.sin(ang-.5)*k],e],{closed:false,stroke:color,lw,seed:seed+1,amp:1});
    inkShape([[e[0]-Math.cos(ang+.5)*k,e[1]-Math.sin(ang+.5)*k],e],{closed:false,stroke:color,lw,seed:seed+2,amp:1});}
}
function stamp(key,cx,cy,rot,t,t0,sc0=.62){
  if(t<t0)return;const s=STAMPS[key];const k=inv(t0,t0+.08,t);const sc=lerp(1.5,1,eIn(k))*sc0;
  x.save();x.globalCompositeOperation='multiply';x.globalAlpha*=.92*clamp(k*1.6);x.translate(cx,cy);x.rotate(rot);x.scale(sc,sc);x.drawImage(s,-s.width/2,-s.height/2);x.restore();
}

// ---------- objects ----------
function card(img,cx,cy,w,rot,{border=14,alpha=1,tape=true,seed=1,shadow=1,scale=1,liftShadow=0}={}){
  const h=w*img.height/img.width;const bw=w+border*2,bh=h+border*2;
  x.save();x.globalAlpha*=alpha;x.translate(cx,cy);x.rotate(rot);x.scale(scale,scale);
  if(shadow>0){x.shadowColor=`rgba(45,28,12,${.34*shadow})`;x.shadowBlur=24+liftShadow*40;x.shadowOffsetX=6+liftShadow*22;x.shadowOffsetY=14+liftShadow*52;}
  x.fillStyle=C.cream;x.fillRect(-bw/2,-bh/2,bw,bh);
  x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetX=0;x.shadowOffsetY=0;
  x.drawImage(img,-w/2,-h/2,w,h);
  if(border>1){x.strokeStyle='rgba(60,40,20,.14)';x.lineWidth=2;x.strokeRect(-bw/2,-bh/2,bw,bh);}
  if(tape){const r=rng(seed);x.save();x.translate((r()-.5)*70,-bh/2+4);x.rotate((r()-.5)*.32);const tw=176,th=54;
    x.fillStyle='rgba(233,220,190,.8)';x.beginPath();x.moveTo(-tw/2,-th/2);x.lineTo(tw/2,-th/2);
    for(let i=1;i<=6;i++)x.lineTo(tw/2+(i%2?-6:0),-th/2+i*th/6);x.lineTo(-tw/2,th/2);
    for(let i=5;i>=0;i--)x.lineTo(-tw/2+(i%2?6:0),-th/2+i*th/6);x.closePath();x.fill();
    x.fillStyle='rgba(255,255,255,.25)';x.fillRect(-tw/2+8,-th/2+6,tw-16,6);x.restore();}
  x.restore();
}
function ribbon(pts,wMax,color,alpha=1){
  const n=pts.length;if(n<3||alpha<=0)return;const Lp=[],Rp=[];
  for(let i=0;i<n;i++){const p=pts[i],q=pts[Math.min(i+1,n-1)],o=pts[Math.max(i-1,0)];const dx=q[0]-o[0],dy=q[1]-o[1];const l=Math.hypot(dx,dy)||1;
    const w=wMax*Math.pow(Math.sin(Math.PI*i/(n-1)),.8)/2;Lp.push([p[0]-dy/l*w,p[1]+dx/l*w]);Rp.push([p[0]+dy/l*w,p[1]-dx/l*w]);}
  x.save();x.globalAlpha*=alpha;x.fillStyle=color;x.beginPath();x.moveTo(Lp[0][0],Lp[0][1]);for(const p of Lp)x.lineTo(p[0],p[1]);for(let i=Rp.length-1;i>=0;i--)x.lineTo(Rp[i][0],Rp[i][1]);x.closePath();x.fill();x.restore();
}
function steam(origins,t,{len=520,limit=null,amp=38,speed=.55,lw=8,alpha=1,seed=5,seg=.36}={}){
  origins.forEach(([ox,oy],i)=>{
    const r=rng(seed+i*17);const ph=r();const L=len*(0.75+r()*.5);const cyc=(t*speed+ph)%1;
    const s0=cyc*(1+seg)-seg,s1=s0+seg;if(s1<=0||s0>=1)return;const pts=[];const jr=rng((seed+i)*131+stepOf(T));
    for(let j=0;j<=22;j++){const s=lerp(Math.max(0,s0),Math.min(1,s1),j/22);let yy=oy-s*L;let xx=ox+Math.sin(s*5.5+t*1.8+ph*6)*amp*(0.4+s);
      if(limit!==null&&yy<limit+18){const over=(limit+18)-yy;yy=limit+18-over*.06;xx+=(i%2?1:-1)*over*.9;}
      pts.push([xx+(jr()-.5)*2.5,yy+(jr()-.5)*2.5]);}
    const fade=alpha*Math.sin(Math.PI*clamp(cyc*1.05)),wv=lw*2.6;
    x.save();x.filter='blur(3px)';ribbon(pts,wv+12,'rgba(80,66,56,.2)',fade);x.restore();
    ribbon(pts,wv,'rgba(255,253,248,.9)',fade);
  });
}
const PUFFS=(()=>{const r=rng(8080);return [...Array(18)].map((_,i)=>({x:250+r()*580,t0:r()*.45,vx:(r()-.5)*170,vy:-250-r()*260,r0:38+r()*40,seed:900+i}));})();
function cloudPuffs(t,oy,t0,mul=1){ // hand-drawn aroma clouds escaping the phone
  const lt=sT(t-t0);if(lt<0)return;
  PUFFS.forEach(p=>{const a=lt-p.t0;if(a<0||a>1.3)return;const rr=p.r0*(1+a*1.7),al=Math.min(1,a*6)*(1-a/1.3)*mul;
    inkShape(ellP(p.x+p.vx*a,oy-30+p.vy*a,rr,rr*.8,{seed:p.seed,n:18,rough:.16}),{fill:'rgba(251,248,242,.94)',stroke:'rgba(42,36,32,.38)',lw:3.2,seed:p.seed,alpha:al});});
}
function leaf(cx,cy,len,wid,rot,{seed=3,alpha=1,shadow=false}={}){
  x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha*=alpha;
  const n=60,Lp=[],Rp=[];const r=rng(seed);
  for(let i=0;i<=n;i++){const s=i/n;const y=-len/2+s*len;const w=wid/2*Math.pow(Math.sin(Math.PI*s),.5);
    Lp.push([-w*(1+(r()-.5)*.03),y]);Rp.push([w*(1+(r()-.5)*.05)-(r()<.14?r()*34:0),y]);}
  const pts=[...Lp,...Rp.reverse()];
  if(shadow){x.save();x.shadowColor='rgba(30,40,10,.28)';x.shadowBlur=34;x.shadowOffsetY=18;sPath(pts,true,seed,0);x.fillStyle='#5E8F3A';x.fill();x.restore();}
  const g=x.createLinearGradient(-wid/2,0,wid/2,0);g.addColorStop(0,'#4B7A30');g.addColorStop(.47,'#6E9E45');g.addColorStop(.53,'#80B053');g.addColorStop(1,'#588836');
  inkShape(pts,{fill:g,stroke:C.ink,lw:6,seed,amp:2});
  x.save();sPath(pts,true,seed,2);x.clip();x.strokeStyle='rgba(35,65,18,.33)';x.lineWidth=2.2;
  for(let y=-len/2;y<len/2;y+=24){x.beginPath();x.moveTo(0,y);x.lineTo(-wid/2,y+wid*.22);x.moveTo(0,y);x.lineTo(wid/2,y+wid*.22);x.stroke();}
  x.restore();
  inkShape([[0,-len/2+30],[0,len/2-30]],{closed:false,stroke:'#C8D68A',lw:16,seed:seed+2,amp:1});
  inkShape([[5,-len/2+30],[5,len/2-30]],{closed:false,stroke:'rgba(40,60,20,.35)',lw:3,seed:seed+3,amp:1});
  x.restore();
}
function chili(cx,cy,len,rot,col,seed,{stem=true,lw=3.5}={}){
