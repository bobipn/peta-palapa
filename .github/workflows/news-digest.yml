name: News Digest Harian

# Ringkasan berita infrastruktur digital -> Telegram + Gmail.
# Jadwal cron GitHub memakai UTC. 23:17 UTC = 06:17 WIB.
# Catatan: jadwal hanya aktif setelah file ini ada di branch default (main),
# dan GitHub bisa menunda run terjadwal beberapa menit s.d. >1 jam saat sibuk.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (tidak mengirim, hanya log & artefak preview)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r news-bot/requirements.txt

      # Daftar berita yang sudah terkirim (agar tidak dikirim ulang besok)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: news-bot/.state
          key: news-digest-state-${{ github.run_id }}
          restore-keys: news-digest-state-

      - name: Build & send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python news-bot/digest.py --dry-run
          else
            python news-bot/digest.py
          fi

      - name: Upload preview (dry-run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: news-bot/out/
          retention-days: 7

      - name: Save state
        if: always() && hashFiles('news-bot/.state/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: news-bot/.state
          key: news-digest-state-${{ github.run_id }}
